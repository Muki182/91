[build]
  publish = "."
  command = "echo 'Static site - no build required'"

# 环境变量
[build.environment]
  NODE_VERSION = "18"
  SITE_NAME = "男男性服务预约系统"
  SITE_DESCRIPTION = "专业男男性服务预约平台"

# API 端点重定向（优先级最高）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA 路由支持
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# 头部规则 - 优化 Cloudflare 兼容性
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Cloudflare 兼容的缓存控制
    Vary = "Accept-Encoding"

[[headers]]
  for = "/*.html"
  [headers.values]
    # HTML 短期缓存，便于更新
    Cache-Control = "public, max-age=7200, must-revalidate"
    # CSP 允许 API 调用和外部资源
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://*.netlify.app https://*.pages.dev https://api.* http://localhost:* ws://localhost:*;"
    # 预加载关键资源
    Link = "</style.css>; rel=preload; as=style, <https://fonts.googleapis.com>; rel=preconnect; crossorigin"

[[headers]]
  for = "/index.html"
  [headers.values]
    # 主页面优化缓存
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    # 启用 Early Hints 支持
    Link = "<https://fonts.googleapis.com>; rel=preconnect; crossorigin, <https://cdn.jsdelivr.net>; rel=preconnect; crossorigin"

[[headers]]
  for = "/*.css"
  [headers.values]
    # CSS 长期缓存
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/*.js"
  [headers.values]
    # JavaScript 长期缓存
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.json"
  [headers.values]
    # JSON 数据短期缓存
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # 静态资源长期缓存
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/jpeg"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/png"

[[headers]]
  for = "/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/gif"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/webp"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "font/woff"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "font/woff2"
    Access-Control-Allow-Origin = "*"

# Netlify Functions 配置
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["**"]

# Dev 配置
[dev]
  command = "npm start"
  port = 3000
  targetPort = 3000
  autoLaunch = false

# Netlify Edge Functions 配置
[[edge_functions]]
  function = "security"
  path = "/*"

[[edge_functions]]
  function = "cache-control"
  path = "/*"

[[edge_functions]]
  function = "geo-redirect"
  path = "/*"

[[edge_functions]]
  function = "rate-limit"
  path = "/api/*"

[[edge_functions]]
  function = "transform"
  path = "/"

# API 端点头部
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Cache-Control = "no-cache, no-store, must-revalidate"